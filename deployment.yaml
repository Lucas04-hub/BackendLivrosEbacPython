apiVersion: v1
kind: Pod
metadata:
  name: livros-api
  labels:
    app: livros-api
spec:
  containers:
    - name: livros-api
      image: livros-api:latest
      ports:
        - containerPort: 8000
      env:
        - name: DATABASE_URL
          value: "sqlite:///livros.db"
        - name: MEU_USUARIO
          value: "admin"
        - name: MINHA_SENHA
          value: "admin"
            