[project]
name = "backend-livros-ebac-python"
version = "0.1.0"
description = ""
authors = [{name = "Lucas"}]
package-mode = false
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "redis (>=4.0.4,<8.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "kafka-python (>=2.3.1,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.init_options]
python = ["."]

[dependency-groups]
dev = [
    "pytest-mock (>=3.15.1,<4.0.0)"
]
